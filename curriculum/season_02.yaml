version: 1
season: {id: season-02, number: 2, title: Сентябрь 2026, month: 2026-09, timezone: Europe/Moscow}

x-sources:
  prompt-ms: &prompt_ms {title: Создание эффективных prompts — Microsoft Learn, url: https://learn.microsoft.com/en-us/training/modules/create-prompts-for-generative-ai-training-tools/}
  prompt-openai: &prompt_openai {title: Практика создания запросов — OpenAI Academy, url: https://academy.openai.com/public/clubs/work-users-ynjqu/resources/prompting}
  prompt-anthropic: &prompt_anthropic {title: Обзор prompt engineering — Anthropic, url: https://docs.anthropic.com/en/docs/build-with-claude/prompt-engineering/overview}
  custom-ms: &custom_ms {title: Создание custom prompt — Microsoft Learn, url: https://learn.microsoft.com/en-us/ai-builder/create-a-custom-prompt}

courses:
  - id: course-02
    number: 2
    title: Промпты с нуля
    start_date: 2026-09-01
    end_date: 2026-09-15
    lessons:
      - {id: lesson-16, date: 2026-09-01, topic: Как определить цель запроса, short_title: Цель запроса, learning_goal: Формулировать ожидаемое изменение или результат до обращения к ИИ, explain_objective: Отличить тему разговора от конкретной цели запроса, try_objective: Превратить три общие темы в проверяемые цели, reinforce_objective: Написать свою цель и критерий её достижения в комментариях, sources: [*prompt_ms]}
      - {id: lesson-17, date: 2026-09-02, topic: Как дать необходимый контекст, short_title: Контекст, learning_goal: Выбирать исходные сведения которые действительно влияют на ответ, explain_objective: Показать связь контекста с точностью и уместностью результата, try_objective: Добавить аудиторию ситуацию и исходные данные к одному запросу, reinforce_objective: Назвать элемент контекста который сильнее всего изменил ответ, sources: [*custom_ms]}
      - {id: lesson-18, date: 2026-09-03, topic: Когда полезно задавать роль, short_title: Роль помощника, learning_goal: Использовать роль как перспективу и набор задач а не магическую формулу, explain_objective: Объяснить когда роль уточняет подход и когда только добавляет шум, try_objective: Сравнить запрос без роли и с уместной профессиональной перспективой, reinforce_objective: Поделиться ролью которая дала полезное изменение результата, sources: [*prompt_anthropic]}
      - {id: lesson-19, date: 2026-09-04, topic: Как задавать ограничения, short_title: Ограничения, learning_goal: Ограничивать объём тон содержание и допустимые предположения, explain_objective: Разобрать полезные ограничения и конфликтующие требования, try_objective: Добавить к задаче три измеримых ограничения, reinforce_objective: Написать какое ограничение сделало ответ практичнее, sources: [*prompt_ms]}
      - {id: lesson-20, date: 2026-09-05, topic: Как выбрать формат результата, short_title: Формат ответа, learning_goal: Запрашивать форму которую можно сразу проверить и использовать, explain_objective: Связать списки таблицы шаблоны и JSON с задачами пользователя, try_objective: Получить один материал в двух форматах и сравнить удобство, reinforce_objective: Показать выбранный формат и объяснить выбор, sources: [*prompt_openai]}
      - {id: lesson-21, date: 2026-09-06, topic: Как использовать примеры в запросе, short_title: Примеры, learning_goal: Показывать образец структуры или стиля не требуя копирования содержания, explain_objective: Объяснить обучение по примеру на уровне конкретного запроса, try_objective: Добавить один входной и выходной пример к задаче, reinforce_objective: Написать какую неоднозначность снял пример, sources: [*prompt_anthropic]}
      - {id: lesson-22, date: 2026-09-07, topic: Как просить уточняющие вопросы, short_title: Уточняющие вопросы, learning_goal: Разрешать системе запросить недостающие данные до ответа, explain_objective: Показать почему уточнение снижает число скрытых предположений, try_objective: Попросить задать до трёх вопросов перед выполнением задачи, reinforce_objective: Поделиться самым полезным уточняющим вопросом, sources: [*custom_ms]}
      - {id: lesson-23, date: 2026-09-08, topic: Как поставить задачу по шагам, short_title: Шаги задачи, learning_goal: Разбивать сложную цель на наблюдаемые этапы без лишней микроменеджмента, explain_objective: Отличить логические этапы от просьбы раскрывать внутренние рассуждения, try_objective: Разложить бытовую задачу на вход проверку и результат, reinforce_objective: Написать какой этап раньше терялся в запросе, sources: [*prompt_ms]}
      - {id: lesson-24, date: 2026-09-09, topic: Как задать критерии качества, short_title: Критерии качества, learning_goal: Описывать признаки хорошего ответа до его получения, explain_objective: Превратить субъективное слово хорошо в проверяемые критерии, try_objective: Составить чек-лист из четырёх критериев для своей задачи, reinforce_objective: Опубликовать самый важный критерий и способ проверки, sources: [*prompt_anthropic]}
      - {id: lesson-25, date: 2026-09-10, topic: Как переработать плохой ответ, short_title: Улучшение ответа, learning_goal: Давать конкретную обратную связь вместо полного перезапуска, explain_objective: Разобрать цикл результат замечание исправление повторная проверка, try_objective: Улучшить слабый ответ двумя адресными замечаниями, reinforce_objective: Сравнить версии и назвать самое эффективное замечание, sources: [*prompt_openai]}
      - {id: lesson-26, date: 2026-09-11, topic: Как работать с длинной задачей, short_title: Длинные задачи, learning_goal: Управлять большим заданием через план промежуточные результаты и контроль контекста, explain_objective: Объяснить риск потери условий и пользу контрольных точек, try_objective: Разделить длинную задачу на три самостоятельных результата, reinforce_objective: Написать где поставлена проверка перед следующим этапом, sources: [*prompt_anthropic]}
      - {id: lesson-27, date: 2026-09-12, topic: Как задавать негативные ограничения, short_title: Что исключить, learning_goal: Ясно указывать нежелательные элементы не перегружая запрос запретами, explain_objective: Показать отличие полезного запрета от длинного списка страхов, try_objective: Добавить два обоснованных исключения к реальной задаче, reinforce_objective: Рассказать какое исключение убрало ненужный результат, sources: [*prompt_ms]}
      - {id: lesson-28, date: 2026-09-13, topic: Как сравнивать формулировки запросов, short_title: Сравнение запросов, learning_goal: Проводить честное сравнение меняя один элемент за раз, explain_objective: Ввести простой A/B-подход к улучшению промпта, try_objective: Проверить две формулировки на одной задаче и одинаковых критериях, reinforce_objective: Написать победившую формулировку и измеримое отличие, sources: [*prompt_openai]}
      - {id: lesson-29, date: 2026-09-14, topic: Универсальная структура хорошего промпта, short_title: Структура промпта, learning_goal: Собирать цель контекст действие формат и критерии в гибкий шаблон, explain_objective: Связать элементы курса в универсальную но не магическую структуру, try_objective: Собрать запрос по пяти элементам для личной задачи, reinforce_objective: Поделиться элементом который раньше чаще всего отсутствовал, sources: [*prompt_ms, *prompt_anthropic]}
      - {id: lesson-30, date: 2026-09-15, topic: Итоговая практика по созданию промпта, short_title: Итоговый промпт, learning_goal: Самостоятельно спроектировать проверить и улучшить запрос, explain_objective: Повторить полный цикл от цели до критериев качества, try_objective: Создать две версии запроса и выбрать лучшую по чек-листу, reinforce_objective: Опубликовать итоговую структуру и главный вывод курса, sources: [*prompt_ms, *prompt_openai]}

  - id: course-03
    number: 3
    title: Промпты на практике
    start_date: 2026-09-16
    end_date: 2026-09-30
    lessons:
      - {id: lesson-31, date: 2026-09-16, topic: Подготовка понятного письма с ИИ, short_title: Письмо, learning_goal: Создавать черновик письма под адресата цель и тон, explain_objective: Разобрать обязательные входные данные для полезного письма, try_objective: Подготовить и отредактировать несекретное письмо, reinforce_objective: Написать какое условие сильнее всего улучшило письмо, sources: [*custom_ms]}
      - {id: lesson-32, date: 2026-09-17, topic: Объяснение сложной темы простыми словами, short_title: Простое объяснение, learning_goal: Настраивать глубину объяснения под знания аудитории, explain_objective: Показать роль аудитории аналогии примера и проверки понимания, try_objective: Получить два объяснения одной темы для разных аудиторий, reinforce_objective: Поделиться аналогией которая действительно помогла понять тему, sources: [*prompt_ms]}
      - {id: lesson-33, date: 2026-09-18, topic: Создание выполнимого плана, short_title: План действий, learning_goal: Получать план с этапами сроками зависимостями и проверками, explain_objective: Отличить перечень пожеланий от последовательного плана, try_objective: Составить план небольшой реальной задачи и проверить зависимости, reinforce_objective: Написать какой шаг пришлось переставить или уточнить, sources: [*prompt_anthropic]}
      - {id: lesson-34, date: 2026-09-19, topic: Сравнение вариантов по критериям, short_title: Сравнение вариантов, learning_goal: Сравнивать альтернативы по заранее выбранным критериям без ложной точности, explain_objective: Показать матрицу критериев допущения и неизвестные данные, try_objective: Сравнить три безопасных варианта в таблице, reinforce_objective: Назвать критерий который изменил первоначальный выбор, sources: [*prompt_openai]}
      - {id: lesson-35, date: 2026-09-20, topic: Поиск идей без случайного списка, short_title: Полезные идеи, learning_goal: Генерировать идеи внутри понятной задачи аудитории и ограничений, explain_objective: Объяснить дивергенцию группировку и отбор идей, try_objective: Получить идеи по трём направлениям и выбрать по критериям, reinforce_objective: Поделиться выбранной идеей и причиной выбора, sources: [*custom_ms]}
      - {id: lesson-36, date: 2026-09-21, topic: Редактирование собственного текста, short_title: Редактура текста, learning_goal: Улучшать ясность сохраняя смысл факты и авторский голос, explain_objective: Разделить редактуру структуры стиля и корректности, try_objective: Отредактировать один абзац с явным списком неизменяемых фактов, reinforce_objective: Показать одно улучшение и одну правку которую решили не принимать, sources: [*prompt_ms]}
      - {id: lesson-37, date: 2026-09-22, topic: Анализ материала с явной задачей, short_title: Анализ, learning_goal: Запрашивать наблюдения основания и ограничения анализа, explain_objective: Отличить пересказ от анализа по заданным вопросам, try_objective: Проанализировать короткий несекретный материал по трём вопросам, reinforce_objective: Написать какой вывод подтверждён текстом а какой требует данных, sources: [*prompt_anthropic]}
      - {id: lesson-38, date: 2026-09-23, topic: Таблицы и структурированные данные, short_title: Таблицы и данные, learning_goal: Преобразовывать текст в согласованную структуру без выдуманных значений, explain_objective: Объяснить схему столбцы типы и обработку отсутствующих данных, try_objective: Извлечь факты из текста в таблицу и сверить строки, reinforce_objective: Назвать поле где потребовалась ручная проверка, sources: [*custom_ms]}
      - {id: lesson-39, date: 2026-09-24, topic: Использование ИИ для обучения, short_title: Обучение с ИИ, learning_goal: Строить объяснение практику и самопроверку вместо получения готового ответа, explain_objective: Показать роль наставника вопросов и обратной связи, try_objective: Создать мини-урок по незнакомому понятию с тремя вопросами, reinforce_objective: Ответить на вопрос и написать где осталось непонимание, sources: [*prompt_ms]}
      - {id: lesson-40, date: 2026-09-25, topic: Подготовка к важному разговору, short_title: Подготовка разговора, learning_goal: Продумывать цель аргументы вопросы и возможные реакции без манипуляций, explain_objective: Разобрать нейтральную подготовку и границы ролевой репетиции, try_objective: Составить план безопасного разговора и отрепетировать вопросы, reinforce_objective: Поделиться вопросом который поможет лучше услышать собеседника, sources: [*prompt_anthropic]}
      - {id: lesson-41, date: 2026-09-26, topic: Поиск нескольких вариантов решения, short_title: Варианты решения, learning_goal: Расширять пространство решений и честно сравнивать ограничения, explain_objective: Показать генерацию альтернатив по разным стратегиям, try_objective: Получить три принципиально разных решения одной задачи, reinforce_objective: Написать какой вариант раньше не рассматривался и почему, sources: [*custom_ms]}
      - {id: lesson-42, date: 2026-09-27, topic: Создание понятной инструкции, short_title: Инструкция, learning_goal: Получать последовательную проверяемую инструкцию с условиями и предупреждениями, explain_objective: Разобрать входные условия шаг действие результат и проверку, try_objective: Создать инструкцию для знакомой безопасной операции и протестировать её, reinforce_objective: Назвать шаг который пришлось уточнить после теста, sources: [*prompt_ms]}
      - {id: lesson-43, date: 2026-09-28, topic: Критика результата без слепого доверия, short_title: Критика результата, learning_goal: Просить конструктивную проверку по критериям и самому оценивать замечания, explain_objective: Отличить полезную критику от автоматического согласия модели, try_objective: Получить критику черновика и проверить каждое замечание, reinforce_objective: Написать какое замечание принято а какое отклонено, sources: [*prompt_anthropic]}
      - {id: lesson-44, date: 2026-09-29, topic: Выполнение многошаговой задачи, short_title: Многошаговая задача, learning_goal: Связывать промежуточные результаты и останавливать процесс для проверки, explain_objective: Показать план состояния контрольные точки и финальную сборку, try_objective: Выполнить задачу в три этапа с подтверждением каждого результата, reinforce_objective: Поделиться контрольной точкой которая предотвратила ошибку, sources: [*prompt_ms, *prompt_openai]}
      - {id: lesson-45, date: 2026-09-30, topic: Итоговый проект по практическим промптам, short_title: Практический проект, learning_goal: Решить реальную задачу сочетая несколько изученных приёмов, explain_objective: Собрать постановку задачи итерации и проверку в воспроизводимый процесс, try_objective: Выполнить личный проект от исходных данных до проверенного результата, reinforce_objective: Опубликовать задачу лучший запрос и измеримое улучшение, sources: [*prompt_ms, *prompt_anthropic]}
