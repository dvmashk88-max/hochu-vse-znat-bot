courses:
  - id: course-06
    number: 6
    title: ИИ для работы и продуктивности
    start_date: 2026-11-01
    end_date: 2026-11-15
    lessons:
      - {id: lesson-76, date: 2026-11-01, topic: Планирование рабочего дня с ИИ, short_title: План дня, learning_goal: Превращать список обязательств в реалистичный план с резервом, explain_objective: Разобрать входные задачи сроки длительность и ограничения дня, try_objective: Составить и вручную проверить план одного рабочего дня, reinforce_objective: Написать какую задачу пришлось перенести или сократить, sources: [*custom]}
      - {id: lesson-77, date: 2026-11-02, topic: Определение приоритетов без передачи решения ИИ, short_title: Приоритеты, learning_goal: Использовать критерии срочности ценности и усилий сохраняя ответственность, explain_objective: Показать как ИИ помогает сравнить но не знает реальных последствий, try_objective: Расставить пять задач по явно заданным критериям, reinforce_objective: Поделиться приоритетом который изменился после сравнения, sources: [*responsible, *prompt]}
      - {id: lesson-78, date: 2026-11-03, topic: Подготовка к рабочей встрече, short_title: Подготовка встречи, learning_goal: Собирать цель повестку вопросы материалы и ожидаемые решения, explain_objective: Отличить встречу для информации от встречи для решения, try_objective: Подготовить короткую повестку реальной несекретной встречи, reinforce_objective: Написать какой вопрос поможет закончить встречу результатом, sources: [*library]}
      - {id: lesson-79, date: 2026-11-04, topic: Превращение заметок в результаты встречи, short_title: Заметки встречи, learning_goal: Выделять решения действия ответственных и открытые вопросы, explain_objective: Показать структуру итогов без выдумывания отсутствующих договорённостей, try_objective: Преобразовать учебные заметки в протокол и сверить факты, reinforce_objective: Назвать пункт который модель ошибочно могла принять за решение, sources: [*custom]}
      - {id: lesson-80, date: 2026-11-05, topic: Работа с деловыми письмами, short_title: Рабочие письма, learning_goal: Готовить ясные письма с целью контекстом действием и сроком, explain_objective: Разобрать структуру письма без лишней формальности, try_objective: Переписать длинное письмо в короткий проверяемый запрос, reinforce_objective: Поделиться изменением которое сделало ожидаемое действие ясным, sources: [*prompt]}
      - {id: lesson-81, date: 2026-11-06, topic: Подготовка рабочих документов, short_title: Рабочие документы, learning_goal: Создавать черновик по фактам шаблону и требованиям организации, explain_objective: Отделить исходные сведения от генерируемых связок и предложений, try_objective: Подготовить раздел документа по несекретным данным и проверить факты, reinforce_objective: Написать где понадобилось решение человека а не модели, sources: [*files, *library]}
      - {id: lesson-82, date: 2026-11-07, topic: Создание понятных инструкций, short_title: Рабочая инструкция, learning_goal: Описывать процесс так чтобы другой человек мог выполнить и проверить его, explain_objective: Разобрать условия шаги исключения результат и контроль, try_objective: Создать и протестировать короткую инструкцию знакомого процесса, reinforce_objective: Назвать шаг который оказался неоднозначным при проверке, sources: [*custom]}
      - {id: lesson-83, date: 2026-11-08, topic: Подготовка материалов для решения, short_title: Подготовка решения, learning_goal: Собирать варианты критерии риски и неизвестные данные без автоматического выбора, explain_objective: Показать decision brief как основу человеческого решения, try_objective: Подготовить сравнение трёх безопасных вариантов, reinforce_objective: Написать какой неизвестный факт важнее всего выяснить, sources: [*responsible, *prompt]}
      - {id: lesson-84, date: 2026-11-09, topic: Анализ вариантов и компромиссов, short_title: Анализ вариантов, learning_goal: Видеть преимущества издержки ограничения и чувствительность вывода, explain_objective: Объяснить trade-off без ложного универсального лучшего варианта, try_objective: Сравнить два решения при разных приоритетах, reinforce_objective: Поделиться условием при котором выбор меняется, sources: [*responsible]}
      - {id: lesson-85, date: 2026-11-10, topic: Быстрое освоение новой рабочей темы, short_title: Новая тема, learning_goal: Строить маршрут обучения с базовыми понятиями практикой и проверкой, explain_objective: Показать диагностику знаний и последовательность от основы к применению, try_objective: Составить трёхдневный план изучения безопасной рабочей темы, reinforce_objective: Написать первый проверяемый результат обучения, sources: [*capability, *prompt]}
      - {id: lesson-86, date: 2026-11-11, topic: Подготовка материала для презентации, short_title: Материал презентации, learning_goal: Превращать цель и доказательства в последовательность тезисов а не украшенные слайды, explain_objective: Разобрать аудиторию основную мысль аргументы и визуальные опоры, try_objective: Создать план пяти слайдов по проверенным данным, reinforce_objective: Поделиться главным тезисом который должен запомнить слушатель, sources: [*library]}
      - {id: lesson-87, date: 2026-11-12, topic: Систематизация рабочей информации, short_title: Система информации, learning_goal: Создавать категории метки правила хранения и поиска без потери происхождения, explain_objective: Показать таксономию и критерии распределения материалов, try_objective: Сгруппировать учебный список записей и проверить спорные категории, reinforce_objective: Написать какое правило классификации пришлось уточнить, sources: [*custom]}
      - {id: lesson-88, date: 2026-11-13, topic: Помощь с повторяющимися задачами, short_title: Повторяющиеся задачи, learning_goal: Выделять стабильный шаблон переменные данные и обязательную проверку, explain_objective: Отличить повторяемую подготовку от решений требующих человека, try_objective: Создать шаблон для одной регулярной несекретной задачи, reinforce_objective: Назвать шаг который нельзя автоматизировать без контроля, sources: [*library, *responsible]}
      - {id: lesson-89, date: 2026-11-14, topic: Создание личного AI-workflow, short_title: Личный AI-workflow, learning_goal: Соединять вход задачу AI-операцию проверку и сохранение результата, explain_objective: Представить простой повторяемый рабочий цикл без сложной автоматизации, try_objective: Нарисовать workflow одной еженедельной задачи, reinforce_objective: Поделиться контрольной точкой которая защищает качество, sources: [*custom, *responsible]}
      - {id: lesson-90, date: 2026-11-15, topic: Итоговая рабочая система с ИИ, short_title: Рабочая система, learning_goal: Собрать несколько приёмов в безопасную персональную систему продуктивности, explain_objective: Повторить планирование подготовку создание результата и проверку, try_objective: Спроектировать недельный процесс с двумя уместными применениями ИИ, reinforce_objective: Опубликовать схему и действие которое останется за человеком, sources: [*capability, *responsible]}

  - id: course-07
    number: 7
    title: ИИ для бизнеса
    start_date: 2026-11-16
    end_date: 2026-11-30
    lessons:
      - {id: lesson-91, date: 2026-11-16, topic: Исследование клиента без выдуманных портретов, short_title: Исследование клиента, learning_goal: Формулировать вопросы и гипотезы которые нужно подтвердить реальными данными, explain_objective: Отличить гипотезу о клиенте от факта о поведении клиента, try_objective: Составить десять нейтральных вопросов для интервью, reinforce_objective: Поделиться вопросом который проверяет самую рискованную гипотезу, sources: [*responsible, *prompt]}
      - {id: lesson-92, date: 2026-11-17, topic: Анализ потребности клиента, short_title: Потребность клиента, learning_goal: Отделять задачу препятствие желаемый результат и контекст использования, explain_objective: Показать анализ реальных ответов без приписывания мотивов, try_objective: Разобрать учебную цитату клиента по четырём полям, reinforce_objective: Написать какой вывод пока остаётся только гипотезой, sources: [*custom]}
      - {id: lesson-93, date: 2026-11-18, topic: Конкурентный анализ по проверяемым данным, short_title: Конкурентный анализ, learning_goal: Сравнивать публичные предложения по единой схеме и фиксировать источники, explain_objective: Разобрать критерии актуальность и запрет на выдумывание данных, try_objective: Создать шаблон таблицы сравнения трёх предложений, reinforce_objective: Поделиться критерием который часто забывают проверять, sources: [*responsible]}
      - {id: lesson-94, date: 2026-11-19, topic: Формулирование понятного предложения, short_title: Предложение, learning_goal: Связать конкретную аудиторию проблему результат и доказательство без громких обещаний, explain_objective: Показать ценностное предложение как проверяемую гипотезу, try_objective: Написать две версии предложения и проверить конкретность, reinforce_objective: Опубликовать фразу которую удалось сделать честнее, sources: [*prompt, *responsible]}
      - {id: lesson-95, date: 2026-11-20, topic: Тексты для продукта без пустого маркетинга, short_title: Текст продукта, learning_goal: Описывать функцию пользу условия и ограничения понятным языком, explain_objective: Отличить свойство продукта от подтверждаемой пользы, try_objective: Переписать учебное описание убрав клише и неподтверждённые обещания, reinforce_objective: Поделиться клише которое заменили конкретным фактом, sources: [*custom, *responsible]}
      - {id: lesson-96, date: 2026-11-21, topic: Разработка маркетинговых идей, short_title: Маркетинговые идеи, learning_goal: Генерировать идеи из цели аудитории канала и ограничений бренда, explain_objective: Показать широкий поиск группировку и отбор по критериям, try_objective: Создать десять идей и выбрать две по реалистичности, reinforce_objective: Написать выбранную идею и критерий её отбора, sources: [*library]}
      - {id: lesson-97, date: 2026-11-22, topic: Клиентская коммуникация с человеческим контролем, short_title: Общение с клиентом, learning_goal: Готовить ясный уважительный ответ сохраняя факты и ответственность компании, explain_objective: Разобрать контекст тон действие и запрет выдумывать условия, try_objective: Подготовить ответ на учебный вопрос клиента и проверить факты, reinforce_objective: Назвать место где ответ обязательно должен проверить человек, sources: [*responsible, *prompt]}
      - {id: lesson-98, date: 2026-11-23, topic: Подготовка к продаже без манипуляций, short_title: Подготовка продажи, learning_goal: Выяснять потребность объяснять соответствие и честно обозначать ограничения, explain_objective: Отличить помощь в выборе от давления и ложной срочности, try_objective: Составить вопросы для безопасной консультации по учебному продукту, reinforce_objective: Поделиться вопросом который защищает клиента от неподходящего выбора, sources: [*responsible]}
      - {id: lesson-99, date: 2026-11-24, topic: Создание полезного FAQ, short_title: FAQ, learning_goal: Собирать реальные вопросы краткие ответы источники и путь эскалации, explain_objective: Показать структуру FAQ и запрет заполнять пробелы догадками, try_objective: Создать пять FAQ-записей из предоставленного описания, reinforce_objective: Написать какой вопрос нельзя ответить без дополнительных данных, sources: [*custom]}
      - {id: lesson-100, date: 2026-11-25, topic: Помощь службе поддержки, short_title: Поддержка, learning_goal: Классифицировать обращение готовить черновик и передавать сложные случаи человеку, explain_objective: Разобрать границы автоматической подготовки и обязательную эскалацию, try_objective: Разделить учебные обращения по типу и срочности, reinforce_objective: Назвать случай который нельзя оставлять без человека, sources: [*responsible]}
      - {id: lesson-101, date: 2026-11-26, topic: Анализ отзывов клиентов, short_title: Анализ отзывов, learning_goal: Выделять повторяющиеся темы частоту примеры и неопределённость выборки, explain_objective: Отличить наблюдение в отзывах от вывода обо всех клиентах, try_objective: Сгруппировать десять учебных отзывов и сохранить цитаты, reinforce_objective: Поделиться темой которую стоит проверить на большей выборке, sources: [*custom, *responsible]}
      - {id: lesson-102, date: 2026-11-27, topic: Создание содержательного контент-плана, short_title: Контент-план, learning_goal: Связывать публикации с вопросами аудитории целями и доступными доказательствами, explain_objective: Показать рубрики последовательность разнообразие и критерии качества, try_objective: Составить недельный план из реальных клиентских вопросов, reinforce_objective: Написать тему которая решает конкретную проблему аудитории, sources: [*library]}
      - {id: lesson-103, date: 2026-11-28, topic: Описание и улучшение бизнес-процессов, short_title: Бизнес-процессы, learning_goal: Фиксировать участников входы шаги решения и выходы процесса, explain_objective: Показать карту процесса и поиск потерь без автоматических выводов, try_objective: Описать один простой процесс своего дела, reinforce_objective: Поделиться шагом где чаще всего возникает задержка, sources: [*custom]}
      - {id: lesson-104, date: 2026-11-29, topic: Поиск точек автоматизации, short_title: Точки автоматизации, learning_goal: Выбирать стабильные частые задачи с понятными данными и контролем риска, explain_objective: Разобрать ценность частоту предсказуемость и стоимость ошибки, try_objective: Оценить три процесса по матрице пригодности, reinforce_objective: Написать какой процесс не стоит автоматизировать первым, sources: [*responsible, *library]}
      - {id: lesson-105, date: 2026-11-30, topic: Итоговая бизнес-задача с ИИ, short_title: Бизнес-проект, learning_goal: Решить одну реальную бизнес-задачу от данных до проверенного действия, explain_objective: Связать клиента предложение коммуникацию процесс и человеческую проверку, try_objective: Создать небольшой проект с исходными данными артефактом и чек-листом, reinforce_objective: Опубликовать измеримый результат без финансовых обещаний, sources: [*responsible, *prompt]}
