courses:
  - id: course-04
    number: 4
    title: Поиск и проверка информации с ИИ
    start_date: 2026-10-01
    end_date: 2026-10-15
    lessons:
      - {id: lesson-46, date: 2026-10-01, topic: Почему языковая модель и поисковик не одно и то же, short_title: Модель и поиск, learning_goal: Различать генерацию ответа и получение актуальных результатов поиска, explain_objective: Сравнить происхождение ответа модели и выдачи поисковой системы, try_objective: Задать один вопрос модели и поиску и отметить различия, reinforce_objective: Написать какой результат требует дополнительной проверки и почему, sources: [*truth, *web]}
      - {id: lesson-47, date: 2026-10-02, topic: Зачем ответу нужны источники, short_title: Источники, learning_goal: Связывать проверяемое утверждение с доступным подтверждением, explain_objective: Объяснить что ссылка сама по себе ещё не доказывает утверждение, try_objective: Сопоставить три утверждения с указанными источниками, reinforce_objective: Поделиться признаком полезного источника для проверки, sources: [*web]}
      - {id: lesson-48, date: 2026-10-03, topic: Первичные и вторичные источники, short_title: Типы источников, learning_goal: Находить первоисточник за пересказом или обзором, explain_objective: Разобрать различие документа исследования сообщения и их пересказа, try_objective: Найти первичный источник для одного безопасного утверждения, reinforce_objective: Написать чем первоисточник изменил понимание факта, sources: [*web, *responsible]}
      - {id: lesson-49, date: 2026-10-04, topic: Как проверять актуальность информации, short_title: Актуальность, learning_goal: Учитывать дату публикации обновления и период действия сведений, explain_objective: Показать почему верный ранее факт может устареть, try_objective: Проверить дату и статус обновления выбранной официальной страницы, reinforce_objective: Поделиться найденным признаком актуальности или устаревания, sources: [*web]}
      - {id: lesson-50, date: 2026-10-05, topic: Как проверять даты и хронологию, short_title: Проверка дат, learning_goal: Сверять дату события публикации и обновления не смешивая их, explain_objective: Разобрать типичные хронологические ошибки в AI-ответах, try_objective: Построить короткую хронологию по двум официальным источникам, reinforce_objective: Написать какую дату пришлось исправить или уточнить, sources: [*truth, *web]}
      - {id: lesson-51, date: 2026-10-06, topic: Как проверять цифры и единицы измерения, short_title: Проверка цифр, learning_goal: Сверять число период единицу и метод расчёта, explain_objective: Показать как убедительная цифра теряет смысл без контекста, try_objective: Проверить одно числовое утверждение по таблице первоисточника, reinforce_objective: Назвать недостающую деталь без которой число вводило в заблуждение, sources: [*truth, *responsible]}
      - {id: lesson-52, date: 2026-10-07, topic: Зачем нужны независимые источники, short_title: Несколько источников, learning_goal: Подтверждать важный вывод источниками с независимым происхождением, explain_objective: Отличить несколько ссылок от нескольких независимых свидетельств, try_objective: Найти два независимых подтверждения одному утверждению, reinforce_objective: Написать совпали ли выводы и где различался контекст, sources: [*web]}
      - {id: lesson-53, date: 2026-10-08, topic: Как проверять цитаты, short_title: Проверка цитат, learning_goal: Находить исходный фрагмент автора и контекст цитирования, explain_objective: Разобрать искажение формулировки авторства и смысла цитаты, try_objective: Проверить одну цитату по исходному официальному документу, reinforce_objective: Сообщить совпала ли цитата дословно и сохранился ли смысл, sources: [*truth]}
      - {id: lesson-54, date: 2026-10-09, topic: Как проверять ссылки из AI-ответа, short_title: Проверка ссылок, learning_goal: Проверять существование адреса соответствие страницы и поддержку утверждения, explain_objective: Показать три отдельные проверки для любой предложенной ссылки, try_objective: Открыть и оценить две ссылки из учебного ответа, reinforce_objective: Написать на каком этапе обнаружилась проблема, sources: [*truth, *web]}
      - {id: lesson-55, date: 2026-10-10, topic: Как распознать уверенную ошибку, short_title: Уверенная ошибка, learning_goal: Замечать конкретность без основания и чрезмерную уверенность, explain_objective: Разобрать сигналы выдуманной детали и отсутствующей неопределённости, try_objective: Пометить в ответе факты мнения предположения и неизвестное, reinforce_objective: Поделиться самым полезным сигналом для остановки и проверки, sources: [*truth]}
      - {id: lesson-56, date: 2026-10-11, topic: Как сравнивать противоречащие ответы, short_title: Противоречия, learning_goal: Не выбирать приятный ответ а искать источник расхождения, explain_objective: Показать различия определений дат условий и исходных данных, try_objective: Составить таблицу расхождений двух коротких ответов, reinforce_objective: Написать какое расхождение удалось объяснить источником, sources: [*truth, *responsible]}
      - {id: lesson-57, date: 2026-10-12, topic: Как запрашивать доказательства и основания, short_title: Основания ответа, learning_goal: Просить отделить утверждения от доказательств и неизвестных данных, explain_objective: Объяснить почему просьба привести источник не гарантирует настоящий источник, try_objective: Запросить таблицу утверждение основание ссылка и статус проверки, reinforce_objective: Назвать утверждение которое осталось без достаточного основания, sources: [*web, *truth]}
      - {id: lesson-58, date: 2026-10-13, topic: Как составить исследовательский план, short_title: План исследования, learning_goal: Определять вопрос подзадачи типы источников и критерий завершения, explain_objective: Разобрать исследование до начала поиска информации, try_objective: Создать план мини-исследования по безопасной бытовой теме, reinforce_objective: Поделиться вопросом который сузил исследование сильнее всего, sources: [*web]}
      - {id: lesson-59, date: 2026-10-14, topic: Как проверить собственный итоговый текст, short_title: Самопроверка, learning_goal: Выполнять фактчекинг утверждений после редактуры и сборки результата, explain_objective: Показать реестр фактов источников и нерешённых сомнений, try_objective: Провести проверку короткого собственного текста по чек-листу, reinforce_objective: Написать какой факт был исправлен или удалён, sources: [*responsible, *truth]}
      - {id: lesson-60, date: 2026-10-15, topic: Итоговое мини-исследование с ИИ, short_title: Мини-исследование, learning_goal: Пройти путь от вопроса до проверенного вывода с прозрачными источниками, explain_objective: Собрать план поиск сравнение источников и проверку утверждений, try_objective: Выполнить мини-исследование и приложить список использованных первоисточников, reinforce_objective: Опубликовать вывод уровень уверенности и главный урок проверки, sources: [*web, *responsible]}

  - id: course-05
    number: 5
    title: Документы, тексты и данные
    start_date: 2026-10-16
    end_date: 2026-10-30
    lessons:
      - {id: lesson-61, date: 2026-10-16, topic: Как подготовить длинный документ к работе с ИИ, short_title: Длинный документ, learning_goal: Определять задачу границы документа и безопасный состав данных, explain_objective: Объяснить ограничения контекста извлечения и конфиденциальности, try_objective: Подготовить несекретный документ и перечень вопросов к нему, reinforce_objective: Написать какую часть документа нельзя было упустить, sources: [*files]}
      - {id: lesson-62, date: 2026-10-17, topic: Как получить полезное краткое содержание, short_title: Краткое содержание, learning_goal: Задавать аудиторию объём фокус и обязательные факты резюме, explain_objective: Отличить универсальное сокращение от целевого резюме, try_objective: Получить два резюме одного текста для разных читателей, reinforce_objective: Поделиться важной деталью потерянной в одной версии, sources: [*files, *prompt]}
      - {id: lesson-63, date: 2026-10-18, topic: Как искать сведения внутри документа, short_title: Поиск в документе, learning_goal: Формулировать точный вопрос и требовать место подтверждения, explain_objective: Показать поиск фрагмента цитаты раздела и связанного условия, try_objective: Найти три ответа с указанием разделов в несекретном документе, reinforce_objective: Написать какой ответ пришлось сверить вручную, sources: [*files]}
      - {id: lesson-64, date: 2026-10-19, topic: Как сравнивать два документа, short_title: Сравнение документов, learning_goal: Сравнивать версии по общей схеме и сохранять контекст различий, explain_objective: Разобрать добавления удаления изменения и неоднозначности, try_objective: Составить таблицу различий двух коротких версий документа, reinforce_objective: Назвать изменение с самым большим практическим последствием, sources: [*files]}
      - {id: lesson-65, date: 2026-10-20, topic: Как извлекать структуру документа, short_title: Структура документа, learning_goal: Восстанавливать разделы тезисы зависимости и отсутствующие элементы, explain_objective: Показать иерархию заголовков и логическую карту материала, try_objective: Превратить сплошной текст в структуру с уровнями, reinforce_objective: Поделиться разделом который оказался не на своём месте, sources: [*prompt]}
      - {id: lesson-66, date: 2026-10-21, topic: Как извлекать таблицы из текста, short_title: Таблицы, learning_goal: Заранее задавать столбцы типы значений и правило пропусков, explain_objective: Объяснить схему таблицы и запрет на додумывание ячеек, try_objective: Извлечь учебные записи в таблицу и сверить каждую строку, reinforce_objective: Написать какое поле чаще всего оставалось неизвестным, sources: [*structured]}
      - {id: lesson-67, date: 2026-10-22, topic: Как работать с CSV и наборами данных, short_title: CSV и данные, learning_goal: Проверять заголовки разделители типы пропуски и единицы до анализа, explain_objective: Простыми словами разобрать строки столбцы и качество исходных данных, try_objective: Описать схему небольшого CSV и найти три проблемы качества, reinforce_objective: Поделиться проблемой которая могла исказить вывод, sources: [*structured]}
      - {id: lesson-68, date: 2026-10-23, topic: Как классифицировать записи с ИИ, short_title: Классификация, learning_goal: Создавать ясные категории правила границ и примеры, explain_objective: Показать неоднозначные случаи и категорию недостаточно данных, try_objective: Классифицировать десять учебных записей и проверить спорные, reinforce_objective: Написать какая граница категории потребовала уточнения, sources: [*structured]}
      - {id: lesson-69, date: 2026-10-24, topic: Как преобразовывать формат данных, short_title: Форматы данных, learning_goal: Менять представление сохраняя значения и отмечая потери, explain_objective: Разобрать преобразование текста таблицы списка и JSON, try_objective: Преобразовать один набор данных в два формата и сверить поля, reinforce_objective: Назвать значение которое было легче всего потерять, sources: [*structured]}
      - {id: lesson-70, date: 2026-10-25, topic: Как редактировать документ с сохранением смысла, short_title: Редактура документа, learning_goal: Разделять языковые правки факты и содержательные решения автора, explain_objective: Показать режим предложений и список неизменяемых утверждений, try_objective: Отредактировать страницу и проверить изменения по исходнику, reinforce_objective: Написать какую AI-правку пришлось отклонить, sources: [*prompt, *responsible]}
      - {id: lesson-71, date: 2026-10-26, topic: Как создать черновик по исходным материалам, short_title: Черновик, learning_goal: Строить новый текст по утверждённому плану и фактической базе, explain_objective: Отделить источники требования структуру и авторскую проверку, try_objective: Создать короткий черновик только из предоставленных фактов, reinforce_objective: Поделиться местом где не хватило исходных данных, sources: [*prompt]}
      - {id: lesson-72, date: 2026-10-27, topic: Как анализировать условия и требования, short_title: Требования, learning_goal: Извлекать обязательства ограничения сроки и вопросы из документа, explain_objective: Разобрать явные и неоднозначные требования без юридических выводов, try_objective: Составить реестр требований из учебного текста, reinforce_objective: Написать какое условие сначала осталось незамеченным, sources: [*files]}
      - {id: lesson-73, date: 2026-10-28, topic: Как превращать документ в чек-лист, short_title: Чек-лист, learning_goal: Создавать проверяемые пункты с ответственным и подтверждением, explain_objective: Отличить пересказ документа от рабочего контрольного списка, try_objective: Собрать чек-лист из безопасной инструкции и проверить полноту, reinforce_objective: Поделиться пунктом который предотвращает самую вероятную ошибку, sources: [*prompt]}
      - {id: lesson-74, date: 2026-10-29, topic: Как работать с несколькими файлами, short_title: Несколько файлов, learning_goal: Указывать роль каждого файла и отслеживать происхождение фактов, explain_objective: Показать карту файлов приоритет версий и разрешение конфликтов, try_objective: Составить сводку двух учебных файлов с указанием источника каждого вывода, reinforce_objective: Написать где файлы противоречили друг другу, sources: [*files]}
      - {id: lesson-75, date: 2026-10-30, topic: Итоговая работа с документами и данными, short_title: Проект с данными, learning_goal: Выполнить извлечение преобразование проверку и сборку результата, explain_objective: Повторить безопасный процесс от исходных файлов до проверяемого артефакта, try_objective: Создать таблицу резюме и чек-лист по несекретному материалу, reinforce_objective: Опубликовать главный результат и этап где понадобилась ручная проверка, sources: [*files, *structured]}

special_days:
  - id: special-2026-10-31
    date: 2026-10-31
    kind: season_summary
    cover_label: ИТОГИ СЕЗОНА
    topic: "Проверяем себя: чему научились за два курса октября"
    short_title: Итоги октября
    learning_goal: Связать проверку информации с работой над документами и подготовиться к ноябрю.
    explain_objective: Подвести итог исследованию источникам фактчекингу документам и структурам данных.
    try_objective: Выполнить мини-проверку документа с извлечением одного подтверждённого вывода.
    reinforce_objective: Пригласить назвать самый полезный навык октября и анонсировать ноябрьские курсы.
    sources: [*truth, *files, *responsible]
