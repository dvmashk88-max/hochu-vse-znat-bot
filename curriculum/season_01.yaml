    kind: review
    cover_label: СПЕЦИАЛЬНЫЙ УРОК
    topic: "Повторяем главное: 10 правил работы с ИИ"
    short_title: 10 правил работы с ИИ
    learning_goal: Собрать ключевые правила первого курса в короткую личную памятку.
    explain_objective: Повторить десять практических правил безопасной и осознанной работы с AI-системами.
    try_objective: Отметить освоенные правила и выбрать два, которые нужно применять внимательнее.
    reinforce_objective: Сформулировать главное личное правило и поделиться им в комментариях.
    sources:
      - title: Принципы ответственного ИИ — Microsoft
        url: https://www.microsoft.com/en-us/ai/principles-and-approach
      - title: Лучшие практики prompt engineering — OpenAI
        url: https://academy.openai.com/public/clubs/work-users-ynjqu/resources/prompting

  - id: special-2026-08-30
    date: 2026-08-30
    kind: review
    cover_label: СПЕЦИАЛЬНЫЙ УРОК
    topic: Разбираем типичные ошибки новичков
    short_title: Ошибки новичков
    learning_goal: Узнавать распространённые ошибки при работе с ИИ и исправлять их до получения результата.
    explain_objective: Разобрать расплывчатую задачу, отсутствие контекста, слепое доверие и передачу лишних данных.
    try_objective: Найти ошибки в учебном запросе и переписать его безопаснее и конкретнее.
    reinforce_objective: Назвать ошибку, которую читатель теперь будет проверять в первую очередь.
    sources:
      - title: Лучшие практики prompt engineering — OpenAI
        url: https://academy.openai.com/public/clubs/work-users-ynjqu/resources/prompting
      - title: Принципы ответственного ИИ — Microsoft
        url: https://www.microsoft.com/en-us/ai/principles-and-approach

  - id: special-2026-08-31
    date: 2026-08-31
    kind: season_summary
    cover_label: ИТОГИ СЕЗОНА
    topic: Что мы освоили за август и что будет дальше
    short_title: Итоги августа
    learning_goal: Осознать освоенные навыки и подготовиться к сентябрьским курсам о промптах.
    explain_objective: Кратко связать понимание ИИ, постановку задачи, контекст, формат и проверку результата.
    try_objective: Выполнить небольшую итоговую задачу по полному циклу и отметить самый полезный навык.
    reinforce_objective: Пригласить рассказать о полезном навыке и анонсировать два сентябрьских курса.
    sources:
      - title: Создание эффективных prompts — Microsoft Learn
        url: https://learn.microsoft.com/en-us/training/modules/create-prompts-for-generative-ai-training-tools/
      - title: Проверка правдивости AI-ответов — OpenAI
        url: https://academy.openai.com/public/clubs/work-users-ynjqu/resources/responsible-use-of-chatgpt-at-work-2025-09-08
