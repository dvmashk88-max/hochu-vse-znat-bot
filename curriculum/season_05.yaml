courses:
  - id: course-08
    number: 8
    title: Создание контента с ИИ
    start_date: 2026-12-01
    end_date: 2026-12-15
    lessons:
      - {id: lesson-106, date: 2026-12-01, topic: Как найти содержательную идею, short_title: Идея контента, learning_goal: Получать идеи из цели аудитории проблемы и доступной экспертизы, explain_objective: Отличить случайную тему от идеи с полезным результатом, try_objective: Создать десять идей по трём направлениям и выбрать одну, reinforce_objective: Написать выбранную идею и её конкретную пользу, sources: [*prompt]}
      - {id: lesson-107, date: 2026-12-02, topic: Как определить аудиторию материала, short_title: Аудитория, learning_goal: Описывать знания задачу ситуацию и ожидание читателя без стереотипов, explain_objective: Показать влияние аудитории на глубину примеры и язык, try_objective: Переписать описание аудитории через наблюдаемые потребности, reinforce_objective: Поделиться одной деталью аудитории которая меняет материал, sources: [*text, *responsible]}
      - {id: lesson-108, date: 2026-12-03, topic: Как сузить тему публикации, short_title: Тема материала, learning_goal: Выбирать один вопрос и обещаемый результат вместо слишком широкой области, explain_objective: Разобрать границы темы угол подачи и исключения, try_objective: Сузить три широкие темы до одного полезного вопроса, reinforce_objective: Написать финальную тему и что сознательно осталось за рамками, sources: [*prompt]}
      - {id: lesson-109, date: 2026-12-04, topic: Как построить структуру контента, short_title: Структура, learning_goal: Располагать тезисы в логике вопрос объяснение пример действие, explain_objective: Показать каркас материала до написания текста, try_objective: Создать структуру из пяти пунктов для выбранной темы, reinforce_objective: Поделиться пунктом который удерживает логику материала, sources: [*text]}
      - {id: lesson-110, date: 2026-12-05, topic: Как создать честный заголовок, short_title: Заголовок, learning_goal: Обещать конкретную пользу без кликбейта и неподтверждённых заявлений, explain_objective: Разобрать ясность конкретность соответствие и любопытство, try_objective: Создать пять заголовков и проверить их по четырём критериям, reinforce_objective: Опубликовать лучший заголовок и причину выбора, sources: [*text, *responsible]}
      - {id: lesson-111, date: 2026-12-06, topic: Как написать первый черновик, short_title: Первый черновик, learning_goal: Создавать текст по структуре фактам и цели сохраняя авторскую позицию, explain_objective: Отделить генерацию черновика от финальной публикации, try_objective: Получить черновик одного раздела и отметить все требующие проверки места, reinforce_objective: Написать какую часть пришлось существенно переписать, sources: [*text]}
      - {id: lesson-112, date: 2026-12-07, topic: Как редактировать AI-черновик, short_title: Редактура, learning_goal: Проверять смысл факты логику повторы и естественность текста, explain_objective: Дать последовательность содержательной и языковой редактуры, try_objective: Отредактировать абзац в два прохода и сравнить версии, reinforce_objective: Поделиться самой важной найденной проблемой, sources: [*text, *responsible]}
      - {id: lesson-113, date: 2026-12-08, topic: Как сохранить собственный стиль, short_title: Авторский стиль, learning_goal: Описывать признаки голоса и выбирать правки вместо копирования чужой манеры, explain_objective: Разобрать лексику ритм тон примеры и запрещённые клише, try_objective: Создать краткий style guide по собственным текстам, reinforce_objective: Написать один признак который делает текст узнаваемым, sources: [*prompt, *text]}
      - {id: lesson-114, date: 2026-12-09, topic: Как проектировать изображения с ИИ, short_title: Изображения, learning_goal: Формулировать сюжет композицию стиль ограничения и проверять соответствие, explain_objective: Объяснить prompt для изображения и риск ошибок в деталях и тексте, try_objective: Составить два варианта описания обложки без генерации брендов, reinforce_objective: Поделиться деталью которая делает композицию понятнее, sources: [*image, *responsible]}
      - {id: lesson-115, date: 2026-12-10, topic: Как создать сценарий, short_title: Сценарий, learning_goal: Строить последовательность сцена цель действие реплика и переход, explain_objective: Отличить тему ролика от готовой драматургической структуры, try_objective: Создать сценарный план минуты контента из шести сцен, reinforce_objective: Написать какой переход пришлось сделать яснее, sources: [*text]}
      - {id: lesson-116, date: 2026-12-11, topic: Как спланировать короткое видео, short_title: Короткое видео, learning_goal: Связывать первые секунды один тезис визуальный ряд и конкретный финал, explain_objective: Показать ограничение короткого формата без обещаний вирусности, try_objective: Адаптировать сценарий в план короткого вертикального видео, reinforce_objective: Поделиться первым кадром и его функцией, sources: [*text, *responsible]}
      - {id: lesson-117, date: 2026-12-12, topic: Как работать с голосом и аудио, short_title: Голос и аудио, learning_goal: Планировать транскрипцию озвучивание произношение и обязательное согласие, explain_objective: Разобрать возможности speech-to-text и text-to-speech и этические границы, try_objective: Подготовить короткий текст для собственной или разрешённой озвучки, reinforce_objective: Написать какую фразу пришлось изменить для естественного звучания, sources: [*audio, *responsible]}
      - {id: lesson-118, date: 2026-12-13, topic: Как адаптировать материал под разные площадки, short_title: Разные площадки, learning_goal: Сохранять основной смысл меняя длину форму начало и CTA, explain_objective: Отличить адаптацию от механического сокращения или копирования, try_objective: Сделать две версии одного материала под разные контексты чтения, reinforce_objective: Поделиться изменением которое зависело именно от площадки, sources: [*text, *prompt]}
      - {id: lesson-119, date: 2026-12-14, topic: Как проверить качество и факты контента, short_title: Проверка контента, learning_goal: Проверять факты источники права ясность и соответствие обещанию, explain_objective: Собрать редакционный pre-publication checklist, try_objective: Проверить учебный материал и отметить исправления по категориям, reinforce_objective: Написать какой пункт проверки поймал серьёзную проблему, sources: [*responsible, *text]}
      - {id: lesson-120, date: 2026-12-15, topic: Итоговый контент-проект с ИИ, short_title: Контент-проект, learning_goal: Пройти путь от идеи и аудитории до проверенного материала и адаптаций, explain_objective: Связать замысел структуру создание редактуру визуал и фактчекинг, try_objective: Создать один законченный материал и версию для второй площадки, reinforce_objective: Опубликовать цель проекта и главное улучшение после проверки, sources: [*text, *image, *responsible]}

  - id: course-09
    number: 9
    title: Автоматизация и AI-агенты с нуля
    start_date: 2026-12-16
    end_date: 2026-12-30
    lessons:
      - {id: lesson-121, date: 2026-12-16, topic: Что такое автоматизация, short_title: Автоматизация, learning_goal: Узнавать повторяемый процесс с ясными правилами входом и результатом, explain_objective: Отличить автоматизацию от ускорения отдельной ручной операции, try_objective: Найти в своём дне три повторяемых процесса и описать один, reinforce_objective: Написать какой процесс имеет самые стабильные правила, sources: [*workflow]}
      - {id: lesson-122, date: 2026-12-17, topic: Что такое workflow, short_title: Workflow, learning_goal: Видеть последовательность шагов условий данных и ответственных, explain_objective: Объяснить workflow как карту движения работы от события до результата, try_objective: Нарисовать простой процесс из четырёх шагов, reinforce_objective: Поделиться местом где процесс чаще всего останавливается, sources: [*workflow]}
      - {id: lesson-123, date: 2026-12-18, topic: Где в автоматизации нужен ИИ а где обычное правило, short_title: ИИ или правило, learning_goal: Выбирать детерминированное правило для точных условий и ИИ для неоднозначного содержания, explain_objective: Сравнить предсказуемость стоимость ошибки и необходимость интерпретации, try_objective: Разделить десять учебных задач на правило ИИ и человек, reinforce_objective: Написать задачу где простое правило безопаснее ИИ, sources: [*responsible, *workflow]}
      - {id: lesson-124, date: 2026-12-19, topic: Что такое триггер автоматизации, short_title: Триггер, learning_goal: Определять точное событие которое запускает процесс один раз и вовремя, explain_objective: Разобрать расписание новый объект изменение и ручной запуск, try_objective: Выбрать триггер для знакомого процесса и проверить ложные срабатывания, reinforce_objective: Поделиться условием которое защищает от лишнего запуска, sources: [*workflow]}
      - {id: lesson-125, date: 2026-12-20, topic: Что такое действие автоматизации, short_title: Действие, learning_goal: Описывать одну проверяемую операцию её вход и ожидаемый результат, explain_objective: Показать атомарные действия и последствия их повторения, try_objective: Разбить один шаг workflow на конкретные действия, reinforce_objective: Написать какое действие должно быть идемпотентным, sources: [*workflow]}
      - {id: lesson-126, date: 2026-12-21, topic: Как данные проходят через процесс, short_title: Данные процесса, learning_goal: Отслеживать поля формат происхождение и чувствительность данных между шагами, explain_objective: Простыми словами показать mapping validation и минимизацию данных, try_objective: Составить карту данных учебного процесса, reinforce_objective: Назвать поле которое нельзя передавать без необходимости, sources: [*workflow, *responsible]}
      - {id: lesson-127, date: 2026-12-22, topic: Что такое API простыми словами, short_title: API, learning_goal: Понимать API как договор обмена запросом и ответом между системами, explain_objective: Объяснить endpoint method authentication и status без программирования, try_objective: Прочитать пример API-запроса и подписать его части, reinforce_objective: Написать какую часть договора важно проверить до интеграции, sources: [*api]}
      - {id: lesson-128, date: 2026-12-23, topic: Как работают интеграции между сервисами, short_title: Интеграции, learning_goal: Понимать соединение авторизацию преобразование данных и обработку ошибок, explain_objective: Показать путь данных и границы ответственности двух систем, try_objective: Нарисовать интеграцию формы таблицы и уведомления, reinforce_objective: Поделиться местом где нужен контроль ошибки, sources: [*api, *workflow]}
      - {id: lesson-129, date: 2026-12-24, topic: Как устроен многошаговый процесс, short_title: Много шагов, learning_goal: Проектировать последовательность с условиями retries и состоянием, explain_objective: Разобрать ветвление ожидание повтор и компенсацию после ошибки, try_objective: Расширить простой workflow до пяти шагов с одной веткой, reinforce_objective: Написать что произойдёт если третий шаг не выполнится, sources: [*workflow]}
      - {id: lesson-130, date: 2026-12-25, topic: Что такое AI-агент, short_title: AI-агент, learning_goal: Отличать агента от чат-ответа и обычного фиксированного workflow, explain_objective: Объяснить цель планирование инструменты действия и обратную связь, try_objective: Сравнить одну задачу как чат workflow и агентную схему, reinforce_objective: Написать где автономность приносит риск а не пользу, sources: [*agent_glossary, *agents]}
      - {id: lesson-131, date: 2026-12-26, topic: Какие инструменты использует AI-агент, short_title: Инструменты агента, learning_goal: Понимать инструменты как ограниченные функции с описанными входами и правами, explain_objective: Показать поиск калькулятор базу и API без антропоморфизации, try_objective: Выбрать минимальный набор инструментов для учебного агента, reinforce_objective: Назвать инструмент который не следует давать без подтверждения, sources: [*agents, *responsible]}
      - {id: lesson-132, date: 2026-12-27, topic: Память и контекст AI-агента, short_title: Память агента, learning_goal: Различать текущий контекст сохранённое состояние и чувствительные данные, explain_objective: Объяснить зачем помнить прогресс и почему нельзя хранить всё подряд, try_objective: Составить список необходимых и лишних данных для учебного агента, reinforce_objective: Поделиться правилом удаления или срока хранения данных, sources: [*agents, *responsible]}
      - {id: lesson-133, date: 2026-12-28, topic: Ограничения и безопасность AI-агента, short_title: Безопасность агента, learning_goal: Ограничивать права бюджет действия и требовать подтверждение рискованных шагов, explain_objective: Разобрать least privilege allowlist журнал и human-in-the-loop, try_objective: Создать safety checklist для простого агента, reinforce_objective: Написать действие которое всегда требует подтверждения человека, sources: [*responsible, *agent_glossary]}
      - {id: lesson-134, date: 2026-12-29, topic: Проектирование простого AI-агента, short_title: Проект агента, learning_goal: Описывать цель входы инструменты состояние ограничения и критерий завершения, explain_objective: Собрать архитектуру агента на одной странице без кода, try_objective: Спроектировать агента для безопасной информационной задачи, reinforce_objective: Поделиться одним ограничением которое делает проект безопаснее, sources: [*agents, *responsible]}
      - {id: lesson-135, date: 2026-12-30, topic: Итоговая схема собственной AI-автоматизации, short_title: AI-автоматизация, learning_goal: Выбрать уместный уровень автоматизации и создать проверяемую схему, explain_objective: Связать workflow данные API AI-инструменты состояние и безопасность, try_objective: Нарисовать полный процесс с failure path и human approval, reinforce_objective: Опубликовать цель схемы и шаг который останется под контролем человека, sources: [*workflow, *agents, *responsible]}

special_days:
  - id: special-2026-12-31
    date: 2026-12-31
    kind: year_summary
    cover_label: ИТОГИ ГОДА
    topic: Что мы научились делать с ИИ в 2026 году
    short_title: Итоги 2026 года
    learning_goal: Увидеть целостную программу навыков и выбрать направление продолжения в 2027 году.
    explain_objective: Подвести итоги пониманию ИИ промптам проверке работе продуктивности бизнесу контенту и автоматизации.
    try_objective: Составить личную карту освоенных навыков и выбрать одно практическое продолжение.
    reinforce_objective: Пригласить назвать самый полезный курс предложить темы на 2027 год и сообщить о продолжении программы.
    sources: [*responsible, *prompt, *agents]
